name: Regen core docs

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'phel-lang ref to pin docs to (tag, branch, or sha)'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regen-docs
  cancel-in-progress: true

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve phel-lang ref
        id: phel
        run: |
          REF="${{ github.event.inputs.ref || 'main' }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out phel-lang/phel-lang
        uses: actions/checkout@v4
        with:
          repository: phel-lang/phel-lang
          ref: ${{ steps.phel.outputs.ref }}
          path: .phel-lang

      - name: Regenerate src/phelCoreDocs.ts
        run: |
          npm run compile
          node scripts/regen-core-docs.cjs "$GITHUB_WORKSPACE/.phel-lang" \
              --phel-version "${{ steps.phel.outputs.ref }}"
          npm run format -- --write src/phelCoreDocs.ts

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/phelCoreDocs.ts; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
          else
              echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with refreshed docs
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/regen-core-docs
          commit-message: 'chore(docs-db): regen against phel-lang ${{ steps.phel.outputs.ref }}'
          title: 'chore(docs-db): regen against phel-lang ${{ steps.phel.outputs.ref }}'
          body: |
            Automated refresh of `src/phelCoreDocs.ts` from phel-lang `${{ steps.phel.outputs.ref }}`.

            Generated by `.github/workflows/regen-docs.yml`. CI re-runs `format:check` + `lint` + `test` + `tokenize` on this PR; merge once green.
          labels: documentation
          assignees: Chemaclass
          delete-branch: true
