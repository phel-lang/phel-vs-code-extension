name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both supported Node versions on Linux; one each on the other two,
        # where a runner minute costs 2x (macOS) / 10x (Windows) and what we
        # are checking is the platform, not the runtime.
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    defaults:
      run:
        # Same shell everywhere, so a step reads the same on all three runners.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run check:changelog
        if: github.event_name == 'pull_request'
      - run: npm run tokenize
      - run: npm run bundle:prod
      - name: vsce package (sanity)
        # `runner.temp` rather than /tmp: on the Windows runner that is a bash
        # path Node would resolve against the wrong drive.
        run: npx --yes @vscode/vsce package --out "${{ runner.temp }}/phel-lang.vsix"

  # Electron-in-CI stays on Linux: the other two runners have no display server
  # and each download of VS Code is ~300 MB.
  integration:
    name: integration (real VS Code host)
    runs-on: ubuntu-latest
    env:
      # `stable` tracks whatever VS Code ships; the extension declares
      # `engines.vscode ^1.88.0`, so the newest release is what users get.
      VSCODE_TEST_VERSION: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `@vscode/test-electron` v3 requires Node 22; the build matrix still
          # covers Node 20 for the extension itself.
          node-version: 22
          cache: npm
      - run: npm ci
      # A ~300 MB VS Code download per run is the main source of flakiness here.
      # The key is unique per run so the entry is refreshed as `stable` moves;
      # the prefix restore-key picks up the most recent one.
      - name: Cache the VS Code test build
        uses: actions/cache@v4
        with:
          # Only the downloaded build; the sibling user-data dir the run creates
          # must not survive into the next one.
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ env.VSCODE_TEST_VERSION }}-${{ github.run_id }}
          restore-keys: |
            vscode-test-${{ runner.os }}-${{ env.VSCODE_TEST_VERSION }}-
      # Electron needs a display server even with --disable-gpu.
      - run: xvfb-run -a npm run test:integration
