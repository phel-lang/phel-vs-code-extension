name: Release

# Manual release: bump version, package the vsix, push the tag, create the
# GitHub Release, and (optionally) publish to the VS Code Marketplace.
#
# Three modes via inputs:
#   * dry_run = true                     -> bump + package, no push, no publish.
#   * publish_marketplace = false        -> push tag, create GH release with
#                                          vsix attached. You upload the vsix
#                                          to the Marketplace web UI yourself.
#   * publish_marketplace = true         -> full automation. Requires the
#                                          `VSCE_PAT` repo secret.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit semver version (leave empty to auto-bump using `bump`)'
        required: false
        type: string
        default: ''
      bump:
        description: 'Auto-bump level when `version` is empty'
        required: false
        type: choice
        default: 'minor'
        options:
          - patch
          - minor
          - major
      publish_marketplace:
        description: 'Also publish to the VS Code Marketplace (requires VSCE_PAT secret). Uncheck to upload the vsix manually.'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: skip git push, GH release, and Marketplace publish'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # release.sh checks current branch is `main`; ensure we're on main
          # rather than a detached HEAD from `actions/checkout`.
          git checkout -B main "$(git rev-parse HEAD)"

      - run: npm ci

      - name: Run release script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          flags=""
          if [[ -n "${{ inputs.version }}" ]]; then
            flags+=" ${{ inputs.version }}"
          else
            flags+=" --bump ${{ inputs.bump }}"
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            flags+=" --no-push"
          elif [[ "${{ inputs.publish_marketplace }}" == "true" ]]; then
            if [[ -z "${VSCE_PAT}" ]]; then
              echo "VSCE_PAT secret is missing but publish_marketplace=true. Add it in repo Settings > Secrets, or uncheck publish_marketplace to upload the vsix manually." >&2
              exit 1
            fi
            flags+=" --publish"
          fi
          ./scripts/release.sh $flags

      - name: Upload vsix artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phel-lang-vsix
          path: phel-lang-*.vsix
          if-no-files-found: warn
